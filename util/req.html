<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ file_name }} | Stream</title>
  <style>
    :root {
      --bg: #020817;
      --bg2: #0f172a;
      --panel: rgba(15, 23, 42, 0.9);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #5eead4;
      --accent2: #60a5fa;
      --border: rgba(148, 163, 184, 0.2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg), var(--bg2));
      color: var(--text);
    }
    .page { min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; }
    .card {
      width: min(980px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 24px 56px rgba(2, 6, 23, 0.55);
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
    }
    .brand { font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .pill {
      border: 1px solid rgba(94, 234, 212, 0.4);
      color: var(--accent);
      background: rgba(94, 234, 212, 0.08);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .content { padding: 24px; }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.4rem, 2vw, 2.2rem);
      word-break: break-word;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .meta span {
      border: 1px solid var(--border);
      background: rgba(148, 163, 184, 0.06);
      border-radius: 999px;
      padding: 7px 12px;
    }
    video {
      width: 100%;
      max-height: 72vh;
      background: #000;
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: 700;
      border-radius: 12px;
      padding: 14px 22px;
      transition: transform 0.2s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #03111d;
    }
    .secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .footer {
      padding: 14px 22px 20px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="card">
      <div class="header">
        <div class="brand">Media Portal</div>
        <div class="pill">Live Stream</div>
      </div>
      <div class="content">
        <h1>{{ file_name }}</h1>
        <div class="meta">
          <span>{{ file_size }}</span>
          <span>ID: {{ file_unique_id[:8] }}</span>
        </div>
        <video controls playsinline preload="metadata">
          <source src="{{ file_url }}" />
          Your browser does not support the video tag.
        </video>
        <div class="button-row">
          <a class="btn primary" href="{{ file_url }}" download>Download</a>
          <a class="btn secondary" href="/" target="_blank" rel="noreferrer">Open Home</a>
        </div>
      </div>
      <div class="footer">Smooth, fast, and reliable media streaming.</div>
    </div>
  </main>
</body>
</html>
